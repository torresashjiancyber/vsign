name: CodeQL

on:
  workflow_dispatch:

env:
  CODEQL_EXTRACTOR_GO_BUILD_TRACING: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8  # v3.1.0

    - name: Utilize Go Module Cache
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c  # v3
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Set correct version of Golang to use during CodeQL run
      uses: actions/setup-go@268d8c0ca0432bb2cf416faae41297df9d262d7f  # v3.3.0
      with:
        go-version: '1.22.5'
        check-latest: true

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@5c02493ebfd65b28fd3b082c65e5af2cd745d91f  # v2.18.2
      with:
        languages: ${{ matrix.language }}

    - name: Build vsign for CodeQL
      run: make vsign

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@5c02493ebfd65b28fd3b082c65e5af2cd745d91f  # v2.18.2