name: CI-Tests

on:
  workflow_dispatch:
  push:
    branches: ['main', 'release-*']
  pull_request:

permissions: read-all

env:
  GO_VERSION: 1.25.5

jobs:
  unit-tests:
    name: Run unit tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c  # v3
        with:
          # In order:
          # * Module download cache
          # * Build cache (Linux)
          # * Build cache (Mac)
          # * Build cache (Windows)
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495  # v3
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Create config.ini
        uses: DamianReeves/write-file-action@0a7fcbe1960c53fc08fe789fa4850d24885f4d84  # v1.2
        with:
          path: ${{ github.workspace }}/test/config.ini
          contents: |
            tpp_url=${{ secrets.TPP_URL }}
            access_token=${{ secrets.ACCESS_TOKEN }}
            tpp_project=${{ secrets.TPP_PROJECT }}
      - name: Create config-ecdsa.ini
        uses: DamianReeves/write-file-action@0a7fcbe1960c53fc08fe789fa4850d24885f4d84  # v1.2
        with:
          path: ${{ github.workspace }}/test/config-ecdsa.ini
          contents: |
            tpp_url=${{ secrets.TPP_URL }}
            access_token=${{ secrets.ACCESS_TOKEN }}
            tpp_project=${{ secrets.TPP_ECDSA_PROJECT }}
      - name: Run Go tests
        run: |
          go env -w GOTOOLCHAIN=go1.25.0+auto
          go test -covermode atomic -coverprofile ./coverage.txt $(go list ./... | grep -v third_party/)
        env:
          TPP_URL: ${{ secrets.TPP_URL }}
          TPP_USERNAME: ${{ secrets.TPP_USERNAME }}
          TPP_PASSWORD: ${{ secrets.TPP_PASSWORD }}
      - name: Upload Coverage Report
        uses: codecov/codecov-action@f32b3a3741e1053eb607407145bc9619351dc93b  # v2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/reports/
          env_vars: OS
          files: ./coverage.txt
          verbose: true
      - name: Run Go tests w/ `-race`
        if: ${{ runner.os == 'Linux' }}
        run: go test -race $(go list ./... | grep -v third_party/)
        env:
          TPP_URL: ${{ secrets.TPP_URL }}
          TPP_USERNAME: ${{ secrets.TPP_USERNAME }}
          TPP_PASSWORD: ${{ secrets.TPP_PASSWORD }}
